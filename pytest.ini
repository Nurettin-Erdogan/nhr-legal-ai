[pytest]
testpaths = tests
# Windows kullanıcı adındaki Türkçe karakterler pytest'in varsayılan geçici
# klasörünü erişilemez kıldığı için tmp kökü proje içine alınır.
addopts = -p no:cacheprovider --basetemp=.local/tmp/pytest
markers =
    real_sessions: oturum iptal denetimini gerçek koduyla çalıştırır (varsayılan olarak testlerde kapalıdır)
