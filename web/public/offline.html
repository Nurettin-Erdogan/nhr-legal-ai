<!doctype html>
<html lang="tr">
  <head>

    <title>Çevrimdışı · JurisAI</title>

      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font: 16px/1.5 system-ui, sans-serif; }

      p { color: #94a3b8; margin: 0 0 1.25rem; }

  </head>
  <body>
    <main>
      <h1>İnternet bağlantısı yok</h1>
      <p>JurisAI hukuk verilerini ve belgelerinizi güvenlik nedeniyle bu cihazda saklamaz. Bağlantı gelince yeniden deneyin.</p>
      <button onclick="location.reload()">Yeniden dene</button>
    </main>
  </body>
</html>
