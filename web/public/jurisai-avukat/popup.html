<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Juris AI Ayarları</title>
  </head>
  <body>
    <header>
      <div class="logo">⚖️</div>
      <div>
        <h1>Juris AI</h1>
        <p>UYAP Avukat Portalı aktarımı</p>
      </div>
    </header>

    <main>
      <label for="apiUrl">API adresi</label>
      <input id="apiUrl" type="url" placeholder="JURISAI bağlantı adresi" />

      <label for="apiKey">API anahtarı</label>
      <input id="apiKey" type="password" placeholder="Juris AI bağlantı anahtarı" />

      <label for="throttleMs">İstekler arası bekleme (ms)</label>
      <input id="throttleMs" type="number" min="500" max="10000" step="100" value="1500" />

      <div class="row">
        <button id="save" class="primary">Kaydet</button>
        <button id="test">Bağlantıyı dene</button>
      </div>

      <button id="rescan" class="ghost">Sayfayı yeniden tara</button>
      <p id="status" class="status"></p>
      <p class="hint">
        UYAP'ta oturum açtıktan sonra evrak listesindeki "Juris AI'ya Aktar" düğmelerini kullan.
        Şifre veya e-imza bilgisi hiçbir zaman okunmaz.
      </p>
    </main>
  </body>
</html>
