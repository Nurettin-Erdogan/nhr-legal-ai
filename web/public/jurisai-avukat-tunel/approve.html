<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JurisAI bağlantı onayı</title>
    <style>
      body { font: 15px system-ui, sans-serif; margin: 28px; color: #14223d; }
      h1 { font-size: 20px; }
      p { line-height: 1.5; }
      button { padding: 10px 16px; margin-right: 10px; border-radius: 8px; cursor: pointer; }
      #approve { background: #2462e8; color: white; border: 0; }
      #reject { background: white; border: 1px solid #8791a2; }
    </style>
  </head>
  <body>
    <h1>JurisAI hesabını UYAP eklentisine bağla?</h1>
    <p>JurisAI sayfası yeni bir bağlantı anahtarı göndermek istiyor. Onaylarsan eklenti, seçtiğin UYAP belgelerini bu hesaba aktarabilecek. Bu isteği sen başlatmadıysan reddet.</p>
    <button id="approve" type="button">Bağlantıyı onayla</button>
    <button id="reject" type="button">Reddet</button>
    <script src="approve.js"></script>
  </body>
</html>
